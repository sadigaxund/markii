name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'res/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'res/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm run lint
